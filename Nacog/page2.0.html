<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>选择题测试</title>

        <script src="../static/vue.js"></script>
        <script src="../static/axios.min.js"></script>
        <link rel="stylesheet"
            href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
        <style>
            .el-header, .el-footer {
                background-color: #B3C0D1;
                color: #333;
                text-align: center;
                line-height: 60px;
            }
            
            .el-aside {
                background-color: white;
                color: #333;
                text-align: center;
                height: 200px;
                line-height: 35px;
                box-shadow: 0 2px 4px rgba(0, 0, 0, .12), 0 0 6px rgba(0, 0, 0, .04);
                border-radius: 8px;
                margin-right: 50px;
            }
            
            .el-main {
                color: #333;
                text-align: center;
                line-height: 100px;
                border: 1px white solid;
                max-width:  1000px;
                box-shadow: 0 2px 4px rgba(0, 0, 0, .12), 0 0 6px rgba(0, 0, 0, .04);
                border-radius: 8px;
                
            }
  
  
</style>
        <script src="https://unpkg.com/element-ui/lib/index.js"></script>

    </head>
    <body>
        <div id="app">
            
            <el-container style="height: 100%;">
                <el-container>
                    <!-- 侧边栏 -->
                    <sidebar>111</sidebar>
                    <!-- 题目部分 -->
                    <el-main>
                        <!-- 选择题 -->
                        <div id="chose">
                            <div class="question-container">
                                <xzt :questions="questions"></xzt>
                                <el-button type="primary"
                                    @click="willSubmit"
                                    id="Submit">提交答案</el-button>

                            </div>
                        </div>
                    </el-main>
                </el-container>
            </el-container>
        </div>

        <!-- 选择题模板 -->

    </body>
    <script src="./component/xzt.js"></script>
    <script src="./component/sidebar.js"></script>

    <script>
       Vue.component('xzt', xzt);
       Vue.component('sidebar',sidebar)

        // 模拟数据
        const mockQuestions = [
            {

                title: "每只小兔吃一个萝卜，选哪一堆正好合适？",
                img:"../static/T1/timu.png",//非必需
                options: [
                    { value: "A", label: "1" ,img:"../static/T1/A.png"},
                    { value: "B", label: "2" ,img:"../static/T1/B.png"},
                    { value: "C", label: "3" ,img:"../static/T1/C.png"},
                    //img非必需
                ],
                selected: ""
            },
            {
                id: 2,
                title: "2+2=?",
                options: [
                    { value: "A", label: "1" },
                    { value: "B", label: "2" },
                    { value: "C", label: "3" },
                    { value: "D", label: "4" }
                ],
                selected: ""
            },
            {
                id: 3,
                title: "2+4=?",

                    { value: "A", label: "4" },
                    { value: "B", label: "5" },
                    { value: "C", label: "6" },
                    { value: "D", label: "7" }
                ],
                selected: ""
            }
        ];
        
        var addr = "127.0.0.1"; // 后端地址
        
        
    </script>
    <script src="app.js"></script>
</html>
